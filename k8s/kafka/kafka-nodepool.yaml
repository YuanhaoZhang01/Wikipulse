
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: wiki-node
  labels:
    strimzi.io/cluster: wikipulse-kafka
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        deleteClaim: false
        kraftMetadata: shared
